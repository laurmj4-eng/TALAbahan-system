name: Build Android APK

on:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode google-services.json
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android-shell/app/google-services.json
          else
            echo "Warning: GOOGLE_SERVICES_JSON secret not set — FCM will not work in this build."
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Generate debug keystore if missing
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -dname "CN=Android Debug,O=Android,C=US" \
              -validity 10000
          fi

      - name: Grant Execute Permission to Gradle
        run: chmod +x android-shell/gradlew
        continue-on-error: true

      - name: Build Debug APK
        run: |
          cd android-shell
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TALAbahan-app
          path: android-shell/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK to Release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          artifacts: android-shell/app/build/outputs/apk/debug/app-debug.apk
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}

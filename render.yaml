# Render Blueprint — TALAbahan System (Docker + MySQL)
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: talabahan-system
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    disks:
      - name: uploads
        mountPath: /var/data
        sizeGB: 1
    envVars:
      - key: CI_ENVIRONMENT
        value: production
      - key: RENDER
        value: "true"
      - key: PORT
        value: "8080"
      - key: app.forceGlobalSecureRequests
        value: "true"
      - key: database.default.port
        value: "3306"
      - key: INERTIA_VERSION
        sync: false
      - key: database.default.hostname
        sync: false
      - key: database.default.database
        sync: false
      - key: database.default.username
        sync: false
      - key: database.default.password
        sync: false
      - key: encryption.key
        sync: false
      - key: RECAPTCHA_SITE_KEY
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: FIREBASE_MEASUREMENT_ID
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: app.baseURL
        sync: false
      - key: FCM_SERVICE_ACCOUNT_PATH
        value: writable/conf/talabahan-firebase-admin.json
